name: Build LG IR Remote APK

on:
  push:
    branches:
      - main
      - agent/lg-ir-remote
    paths:
      - "lg-ir-remote/**"
      - ".github/workflows/build-lg-ir-apk.yml"
  pull_request:
    paths:
      - "lg-ir-remote/**"
      - ".github/workflows/build-lg-ir-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests, lint and build APK
        run: gradle --no-daemon -p lg-ir-remote testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LG-IR-Remote-debug
          path: lg-ir-remote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
