name: Build Auto Touch Minh Redmi Lite v1.3

on:
  workflow_dispatch:
  push:
    branches: [agent/autotouch-minh-v1-3-redmi-lite]
    paths:
      - 'AutoTouchMinh/redmilite/**'
      - 'AutoTouchMinh/ci/redmi_lite_api33_test.sh'
      - 'AutoTouchMinh/settings.gradle.kts'
      - '.github/workflows/build-autotouch-redmi-lite.yml'
  pull_request:
    paths:
      - 'AutoTouchMinh/redmilite/**'
      - 'AutoTouchMinh/ci/redmi_lite_api33_test.sh'
      - 'AutoTouchMinh/settings.gradle.kts'
      - '.github/workflows/build-autotouch-redmi-lite.yml'

permissions:
  contents: read

concurrency:
  group: autotouch-redmi-lite-${{ github.ref }}
  cancel-in-progress: true

env:
  KEYSTORE_PATH: AutoTouchMinh/.ci/autotouch-personal-test.jks
  KEY_ALIAS: autotouch_personal
  STORE_PASSWORD: AutoTouchMinh_v12_personal_test
  KEY_PASSWORD: AutoTouchMinh_v12_personal_test

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable personal signing key
        uses: actions/cache@v4
        with:
          path: ${{ env.KEYSTORE_PATH }}
          key: autotouch-minh-personal-signing-v1

      - name: Create key only when cache is unavailable
        shell: bash
        run: |
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Auto Touch Minh Redmi Lite, O=Minh, C=VN"
          fi

      - name: Build Redmi Lite release APK
        id: lite_build
        continue-on-error: true
        working-directory: AutoTouchMinh
        env:
          AUTOTOUCH_KEYSTORE_PATH: ${{ github.workspace }}/${{ env.KEYSTORE_PATH }}
          AUTOTOUCH_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          AUTOTOUCH_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          AUTOTOUCH_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean :redmilite:lintRelease :redmilite:assembleRelease 2>&1 | tee redmi-lite-build.log

      - name: Upload Redmi Lite diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_v1.3.0_Redmi_Lite_Diagnostic_Log
          path: AutoTouchMinh/redmi-lite-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop when Redmi Lite build failed
        if: steps.lite_build.outcome == 'failure'
        run: exit 1

      - name: Verify signature and package metadata
        working-directory: AutoTouchMinh
        shell: bash
        run: |
          set -euxo pipefail
          APK='redmilite/build/outputs/apk/release/redmilite-release.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee redmi-lite-signature.txt
          grep -q 'Verified using v2 scheme' redmi-lite-signature.txt
          "$AAPT" dump badging "$APK" | tee redmi-lite-badging.txt
          grep -q "package: name='com.minh.autotouch.redmilite' versionCode='1' versionName='1.3.0-redmi-lite'" redmi-lite-badging.txt
          grep -q "targetSdkVersion:'32'" redmi-lite-badging.txt

      - name: Prepare Redmi Lite deliverables
        working-directory: AutoTouchMinh
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output-redmi-lite/evidence
          cp redmilite/build/outputs/apk/release/redmilite-release.apk output-redmi-lite/AutoTouchMinh-v1.3.0-Redmi10-MIUI14-Lite.apk
          cp redmi-lite-build.log redmi-lite-signature.txt redmi-lite-badging.txt output-redmi-lite/evidence/
          sha256sum output-redmi-lite/*.apk > output-redmi-lite/SHA256SUMS.txt
          zip -qr output-redmi-lite/AutoTouchMinh-v1.3.0-Redmi-Lite-source.zip redmilite ci/redmi_lite_api33_test.sh settings.gradle.kts build.gradle.kts gradle.properties

      - uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_v1.3.0_Redmi_Lite_Deliverables
          path: AutoTouchMinh/output-redmi-lite/
          if-no-files-found: error
          retention-days: 30

  android13_emulator_test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: AutoTouchMinh_v1.3.0_Redmi_Lite_Deliverables
          path: apk-output

      - name: Install and launch on Android 13 API 33
        shell: bash
        run: bash AutoTouchMinh/ci/redmi_lite_api33_test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AutoTouchMinh_v1.3.0_Redmi_Lite_Android13_Evidence
          path: emulator-evidence/
          if-no-files-found: error
          retention-days: 30
