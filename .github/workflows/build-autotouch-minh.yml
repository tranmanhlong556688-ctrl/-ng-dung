name: Build and Emulator Test Auto Touch Minh v1.2

on:
  workflow_dispatch:
  push:
    branches: [agent/autotouch-minh-v1-2-emulator-tested]
    paths:
      - 'AutoTouchMinh/**'
      - '.github/workflows/build-autotouch-minh.yml'
  pull_request:
    paths:
      - 'AutoTouchMinh/**'
      - '.github/workflows/build-autotouch-minh.yml'

permissions:
  contents: read

env:
  KEYSTORE_PATH: AutoTouchMinh/.ci/autotouch-personal-test.jks
  KEY_ALIAS: autotouch_personal
  STORE_PASSWORD: AutoTouchMinh_v12_personal_test
  KEY_PASSWORD: AutoTouchMinh_v12_personal_test

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ${{ env.KEYSTORE_PATH }}
          key: autotouch-minh-personal-signing-v1

      - name: Create signing key when missing
        shell: bash
        run: |
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Auto Touch Minh Personal, OU=Personal Automation, O=Minh, L=Vietnam, C=VN"
          fi

      - name: Lint and build signed APKs
        working-directory: AutoTouchMinh
        env:
          AUTOTOUCH_KEYSTORE_PATH: ${{ github.workspace }}/${{ env.KEYSTORE_PATH }}
          AUTOTOUCH_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          AUTOTOUCH_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          AUTOTOUCH_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean lintDebug assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Verify APK signatures
        working-directory: AutoTouchMinh
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signature-debug.txt
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signature-release.txt
          grep -q "Verified using v2 scheme" signature-release.txt

      - name: Prepare deliverables
        working-directory: AutoTouchMinh
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/AutoTouchMinh-v1.2.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk output/AutoTouchMinh-v1.2.0-installable-release.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
          zip -qr output/AutoTouchMinh-v1.2.0-source.zip . \
            -x 'app/build/*' '.gradle/*' '.ci/*' 'output/*' 'build.log' 'signature-*.txt'

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_v1.2.0_Installable_APKs
          path: |
            AutoTouchMinh/output/AutoTouchMinh-v1.2.0-debug.apk
            AutoTouchMinh/output/AutoTouchMinh-v1.2.0-installable-release.apk
            AutoTouchMinh/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload source and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_v1.2.0_Source_and_Build_Evidence
          path: |
            AutoTouchMinh/output/AutoTouchMinh-v1.2.0-source.zip
            AutoTouchMinh/build.log
            AutoTouchMinh/signature-debug.txt
            AutoTouchMinh/signature-release.txt
          if-no-files-found: error
          retention-days: 30

  emulator_install_test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: AutoTouchMinh_v1.2.0_Installable_APKs
          path: apk-output

      - name: Create lightweight Android 13 emulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p emulator-evidence
          IMAGE='system-images;android-33;default;x86_64'
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' "$IMAGE" | tee emulator-evidence/sdk-install.txt
          echo no | avdmanager create avd --force --name autotouch33 --package "$IMAGE" --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd autotouch33 -no-window -noaudio -no-boot-anim \
            -gpu swiftshader_indirect -accel on -no-snapshot -wipe-data \
            > emulator-evidence/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then
              echo EMULATOR_BOOT_OK | tee emulator-evidence/progress.txt
              exit 0
            fi
            sleep 4
          done
          echo EMULATOR_BOOT_FAILED | tee emulator-evidence/progress.txt
          exit 1

      - name: Install APK, launch app and test services
        timeout-minutes: 4
        shell: bash
        run: |
          set -euxo pipefail
          APK='apk-output/AutoTouchMinh-v1.2.0-installable-release.apk'
          PACKAGE='com.minh.autotouch.personal'
          ACCESSIBILITY_COMPONENT="$PACKAGE/com.minh.autotouch.AutomationAccessibilityService"
          PROGRESS='emulator-evidence/progress.txt'

          adb install "$APK" | tee emulator-evidence/install.txt
          echo INSTALL_OK >> "$PROGRESS"

          adb shell pm path "$PACKAGE" | tee emulator-evidence/package-path.txt
          grep -q 'package:' emulator-evidence/package-path.txt
          echo PACKAGE_OK >> "$PROGRESS"

          adb shell am start -W -n "$PACKAGE/com.minh.autotouch.MainActivity" | tee emulator-evidence/launch.txt
          grep -q 'Status: ok' emulator-evidence/launch.txt
          adb shell pidof "$PACKAGE"
          echo LAUNCH_OK >> "$PROGRESS"

          adb shell dumpsys package "$PACKAGE" > emulator-evidence/package.txt
          grep -q 'AutomationAccessibilityService' emulator-evidence/package.txt
          grep -q 'OverlayService' emulator-evidence/package.txt
          echo SERVICES_DECLARED_OK >> "$PROGRESS"

          adb shell appops set "$PACKAGE" SYSTEM_ALERT_WINDOW allow
          echo OVERLAY_PERMISSION_OK >> "$PROGRESS"

          adb shell settings put secure enabled_accessibility_services "$ACCESSIBILITY_COMPONENT"
          adb shell settings put secure accessibility_enabled 1
          sleep 3
          adb shell dumpsys accessibility > emulator-evidence/accessibility.txt
          grep -q 'AutomationAccessibilityService' emulator-evidence/accessibility.txt
          echo ACCESSIBILITY_OK >> "$PROGRESS"

          adb shell am start-foreground-service -n "$PACKAGE/com.minh.autotouch.OverlayService" | tee emulator-evidence/overlay-start.txt
          sleep 3
          adb shell dumpsys activity services "$PACKAGE" > emulator-evidence/services.txt
          grep -q 'OverlayService' emulator-evidence/services.txt
          echo OVERLAY_SERVICE_OK >> "$PROGRESS"

          adb uninstall "$PACKAGE"
          echo UNINSTALL_OK >> "$PROGRESS"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_Android13_Emulator_Evidence
          path: emulator-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Stop emulator
        if: always()
        run: adb emu kill || true
