name: Build and Emulator Test Auto Touch Minh v1.2

on:
  workflow_dispatch:
  push:
    branches: [agent/autotouch-minh-v1-2-emulator-tested]
    paths:
      - 'AutoTouchMinh/**'
      - '.github/workflows/build-autotouch-minh.yml'
  pull_request:
    paths:
      - 'AutoTouchMinh/**'
      - '.github/workflows/build-autotouch-minh.yml'

permissions:
  contents: read

env:
  APP_DIR: AutoTouchMinh
  KEYSTORE_PATH: AutoTouchMinh/.ci/autotouch-personal-test.jks
  KEY_ALIAS: autotouch_personal
  STORE_PASSWORD: AutoTouchMinh_v12_personal_test
  KEY_PASSWORD: AutoTouchMinh_v12_personal_test

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable personal signing key
        uses: actions/cache@v4
        with:
          path: ${{ env.KEYSTORE_PATH }}
          key: autotouch-minh-personal-signing-v1

      - name: Create signing key when missing
        shell: bash
        run: |
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Auto Touch Minh Personal, OU=Personal Automation, O=Minh, L=Vietnam, C=VN"
          fi

      - name: Lint and build signed APKs
        id: gradle_build
        continue-on-error: true
        working-directory: AutoTouchMinh
        env:
          AUTOTOUCH_KEYSTORE_PATH: ${{ github.workspace }}/${{ env.KEYSTORE_PATH }}
          AUTOTOUCH_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          AUTOTOUCH_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          AUTOTOUCH_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean lintDebug assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Verify APK signatures
        if: steps.gradle_build.outcome == 'success'
        working-directory: AutoTouchMinh
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signature-debug.txt
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signature-release.txt
          grep -q "Verified using v2 scheme" signature-release.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_v1.2.0_build_log
          path: |
            AutoTouchMinh/build.log
            AutoTouchMinh/signature-debug.txt
            AutoTouchMinh/signature-release.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop when build failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Prepare APKs and source
        working-directory: AutoTouchMinh
        shell: bash
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/AutoTouchMinh-v1.2.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk output/AutoTouchMinh-v1.2.0-installable-release.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
          zip -qr output/AutoTouchMinh-v1.2.0-source.zip . \
            -x 'app/build/*' '.gradle/*' '.ci/*' 'output/*' 'build.log' 'signature-*.txt'

      - name: Upload APKs for emulator tests and delivery
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_v1.2.0_Installable_APKs
          path: |
            AutoTouchMinh/output/AutoTouchMinh-v1.2.0-debug.apk
            AutoTouchMinh/output/AutoTouchMinh-v1.2.0-installable-release.apk
            AutoTouchMinh/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_v1.2.0_Source
          path: AutoTouchMinh/output/AutoTouchMinh-v1.2.0-source.zip
          if-no-files-found: error
          retention-days: 30

  emulator_smoke_test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 35]
    steps:
      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          name: AutoTouchMinh_v1.2.0_Installable_APKs
          path: apk-output

      - name: Boot emulator and test installation/services
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail
            APK="apk-output/AutoTouchMinh-v1.2.0-installable-release.apk"
            PACKAGE="com.minh.autotouch.personal"
            ACCESSIBILITY_COMPONENT="$PACKAGE/com.minh.autotouch.AutomationAccessibilityService"
            EVIDENCE_DIR="$GITHUB_WORKSPACE/emulator-evidence-api-${{ matrix.api-level }}"
            mkdir -p "$EVIDENCE_DIR"
            PROGRESS="$EVIDENCE_DIR/smoke-progress.txt"
            : > "$PROGRESS"

            adb install "$APK" | tee "$EVIDENCE_DIR/install.txt"
            echo INSTALL_OK >> "$PROGRESS"

            adb shell pm path "$PACKAGE" | tee "$EVIDENCE_DIR/package-path.txt"
            grep -q "package:" "$EVIDENCE_DIR/package-path.txt"
            echo PACKAGE_OK >> "$PROGRESS"

            adb shell am start -W -n "$PACKAGE/com.minh.autotouch.MainActivity" | tee "$EVIDENCE_DIR/launch.txt"
            grep -q "Status: ok" "$EVIDENCE_DIR/launch.txt"
            adb shell pidof "$PACKAGE"
            echo LAUNCH_OK >> "$PROGRESS"

            adb shell dumpsys package "$PACKAGE" > "$EVIDENCE_DIR/package.txt"
            grep -q "com.minh.autotouch.AutomationAccessibilityService" "$EVIDENCE_DIR/package.txt"
            grep -q "com.minh.autotouch.OverlayService" "$EVIDENCE_DIR/package.txt"
            echo SERVICES_DECLARED_OK >> "$PROGRESS"

            adb shell appops set "$PACKAGE" SYSTEM_ALERT_WINDOW allow
            echo OVERLAY_PERMISSION_OK >> "$PROGRESS"

            adb shell settings put secure enabled_accessibility_services "$ACCESSIBILITY_COMPONENT"
            adb shell settings put secure accessibility_enabled 1
            sleep 3
            adb shell dumpsys accessibility > "$EVIDENCE_DIR/accessibility.txt"
            grep -q "com.minh.autotouch.AutomationAccessibilityService" "$EVIDENCE_DIR/accessibility.txt"
            echo ACCESSIBILITY_OK >> "$PROGRESS"

            adb shell am start-foreground-service -n "$PACKAGE/com.minh.autotouch.OverlayService" | tee "$EVIDENCE_DIR/overlay-start.txt"
            sleep 3
            adb shell dumpsys activity services "$PACKAGE" > "$EVIDENCE_DIR/services.txt"
            grep -q "OverlayService" "$EVIDENCE_DIR/services.txt"
            echo OVERLAY_SERVICE_OK >> "$PROGRESS"

            adb shell am force-stop "$PACKAGE"
            adb uninstall "$PACKAGE"
            echo UNINSTALL_OK >> "$PROGRESS"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_Emulator_API_${{ matrix.api-level }}_Evidence
          path: emulator-evidence-api-${{ matrix.api-level }}/
          if-no-files-found: error
          retention-days: 14
