name: Build Auto Touch Minh Safe APK

on:
  workflow_dispatch:
  push:
    branches: [agent/autotouch-minh-v1-1-compliant]
    paths:
      - 'AutoTouchMinh/**'
      - '.github/workflows/build-autotouch-minh.yml'
  pull_request:
    paths:
      - 'AutoTouchMinh/**'
      - '.github/workflows/build-autotouch-minh.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AutoTouchMinh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint and build APKs
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean lintDebug assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_v1.1.0_build_log
          path: AutoTouchMinh/build.log
          if-no-files-found: error
          retention-days: 14

      - name: Stop when Gradle failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Prepare deliverables
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/AutoTouchMinh-v1.1.0-safe-debug.apk
          cp app/build/outputs/apk/release/app-release.apk output/AutoTouchMinh-v1.1.0-safe-release.apk
          zip -qr output/AutoTouchMinh-v1.1.0-safe-source.zip . -x 'app/build/*' '.gradle/*' 'output/*' 'build.log'

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_v1.1.0_Safe_APK
          path: |
            AutoTouchMinh/output/AutoTouchMinh-v1.1.0-safe-debug.apk
            AutoTouchMinh/output/AutoTouchMinh-v1.1.0-safe-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchMinh_v1.1.0_Safe_Source
          path: AutoTouchMinh/output/AutoTouchMinh-v1.1.0-safe-source.zip
          if-no-files-found: error
          retention-days: 30
