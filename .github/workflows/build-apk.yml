name: Build ML Cun Cung v2 APK

on:
  workflow_dispatch:
  push:
    branches: [main, ml-cun-cung-v2-semi3d]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint, test and build APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ML_Cun_Cung_v2_build_log
          path: build.log
          if-no-files-found: error
          retention-days: 14

      - name: Stop when Gradle failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/ML_Cun_Cung_v2.0_Semi3D-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ML_Cun_Cung_v2.0_Semi3D_APK
          path: output/ML_Cun_Cung_v2.0_Semi3D-debug.apk
          if-no-files-found: error
          retention-days: 30
