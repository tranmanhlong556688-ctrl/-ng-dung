name: Build Auto Kiem Tra Binh APK

on:
  workflow_dispatch:
  push:
    branches:
      - auto-kiem-tra-binh-minh
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        run: gradle --no-daemon clean :app:lintRelease :app:assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/AutoKiemTraBinh_Minh_v1.0.apk
          sha256sum output/AutoKiemTraBinh_Minh_v1.0.apk > output/AutoKiemTraBinh_Minh_v1.0.sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoKiemTraBinh_Minh_v1.0_APK
          path: output/
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/AutoKiemTraBinh_Minh_v1.0.apk
            output/AutoKiemTraBinh_Minh_v1.0.sha256.txt
          generate_release_notes: true
