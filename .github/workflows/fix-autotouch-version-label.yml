name: Fix AutoTouch version label

on:
  push:
    branches: [agent/autotouch-minh-v1-2-emulator-tested]
    paths:
      - '.github/workflows/fix-autotouch-version-label.yml'

permissions:
  contents: write

jobs:
  fix-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autotouch-minh-v1-2-emulator-tested

      - name: Replace stale visible version
        run: |
          set -euxo pipefail
          FILE='AutoTouchMinh/app/src/main/java/com/minh/autotouch/MainActivity.kt'
          grep -q 'Auto Touch Minh v1.1.0' "$FILE"
          sed -i 's/Auto Touch Minh v1\.1\.0/Auto Touch Minh v1.2.1/' "$FILE"
          grep -q 'Auto Touch Minh v1.2.1' "$FILE"

      - name: Commit version-label correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AutoTouchMinh/app/src/main/java/com/minh/autotouch/MainActivity.kt
          git commit -m 'fix: show Auto Touch Minh v1.2.1 in app UI'
          git push origin HEAD:agent/autotouch-minh-v1-2-emulator-tested
